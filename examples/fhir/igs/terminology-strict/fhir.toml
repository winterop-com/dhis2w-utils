# fhir.toml - configuration for `d2w fhir generate` (scaffolded by `d2w fhir init`).
# Only the essentials live here; every available option is documented with its default
# in fhir.toml.example beside this file, and explained in depth at
# https://winterop-com.github.io/dhis2w-utils/fhir/301-fhir-toml/

profile = "local_basic"           # DHIS2 profile to read metadata from

[ig]
id = "dhis2.fhir.examples.terminology-strict"
canonical = "http://example.org/fhir/examples/terminology-strict"
name = "ExamplesTerminologyStrict"
title = "Strict terminology example guide"
publisher = "dhis2w-utils examples"
# "draft" while building; "active" for production - drives the sushi-config status
# and the status and experimental flag on every generated CodeSystem/ValueSet/Questionnaire.
status = "draft"

[generate.data_sets]
include_ids = ["TuL8IOPzpHh"]

[generate.event_programs]
include_ids = ["EVTsupVis01"]

[generate.tracker_programs]
include_ids = ["PrAncCare01"]

# Edited in by hand after `d2w fhir init`; README.md explains each line.

[generate]
# Every published concept is coded by its DHIS2 code rather than its DHIS2 UID. The
# trade is in README.md; `d2w fhir validate --code-source code` is what measures it.
concept_code_source = "code"

[generate.option_sets]
# The seven option sets on this instance whose every option carries a valid, unique
# FHIR code. The other five would refuse the run under `concept_code_source = "code"`.
include_ids = [
    "pC3N9N77UmT",
    "udkr3ihaeD3",
    "x31y45jvIQL",
    "OGmE3wUMEzu",
    "kzgQRhOCadd",
    "XdI8KRJiRoZ",
    "OsVaccType1",
]

[generate.categories]
include_ids = ["yY2bQYqNt0o", "Qzh0MSUx4RM"]

[generate.organisation_units]
root = "PMa2VCrupOd"
max_level = 4

[serve]
# An answer outside its option list is refused rather than warned about.
strict_codes = true
