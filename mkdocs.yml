site_name: dhis2w
site_description: Python toolkit for DHIS2 (client, CLI, MCP server, browser automation).
site_url: https://winterop-com.github.io/dhis2w-utils/
repo_url: https://github.com/winterop-com/dhis2w-utils
repo_name: winterop-com/dhis2w-utils
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    # Top-level tabs (Get started / Architecture / Client / CLI / MCP / FHIR /
    # Query language / Project) keep the surface-distinction visible up top
    # while each tab carries its own focused sidebar tree, so the Python API
    # surface (45 pages) gets its own home instead of dominating every page's
    # left rail.
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.share
    - content.code.copy

