[project]
name = "dhis2w-mcp-router"
version = "0.23.0"
description = "Domain-neutral MCP router: front many upstream MCP servers behind two meta-tools (search + dispatch) so an agent gets lazy, searchable tool discovery instead of a huge up-front tool payload."
readme = "README.md"
authors = [{ name = "Morten Hansen", email = "morten@winterop.com" }]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.4.2",
    "pydantic>=2.13.4",
]

# Experimental: not yet in the pypi-publish matrix (.github/workflows/pypi-publish.yml). The core is
# domain-neutral (depends only on FastMCP, no dhis2w-* imports) so it can graduate to publish — or
# extract to a standalone repo — without a rewrite.

[project.scripts]
dhis2w-mcp-router = "dhis2w_mcp_router.server:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
