[project]
name = "dhis2w-core"
version = "1.3.0"
description = "Shared DHIS2 tooling runtime: profile discovery, plugin registry, auth factory, token store, first-party plugins."
readme = "README.md"
authors = [{ name = "Morten Hansen", email = "morten@winterop.com" }]
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "dhis2w-client>=1.3.0,<2.0",
  "pydantic>=2.13",
  "pydantic-settings>=2.13",
  "tomli-w>=1.2",
  "typer>=0.26.8",
  "rich>=15",
  "fastmcp>=3.4.4",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.22",
  "bcrypt>=5.0.0",
  "questionary>=2.1.1",
  "dhis2w-ql>=1.3.0,<2.0",
]

[project.urls]
Homepage = "https://github.com/winterop-com/dhis2w-utils"
Documentation = "https://winterop-com.github.io/dhis2w-utils/"
Repository = "https://github.com/winterop-com/dhis2w-utils"
Changelog = "https://github.com/winterop-com/dhis2w-utils/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
