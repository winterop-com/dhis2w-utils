[project]
name = "dhis2w-fhir-serve"
version = "1.9.0.dev0"
description = "FHIR facade server for a generated IG - serves the compiled or live-built resources and receives QuestionnaireResponse captures; mounted as `d2w fhir serve`."
readme = "README.md"
authors = [{ name = "Morten Hansen", email = "morten@winterop.com" }]
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aiosqlite>=0.22",
    "dhis2w-fhir>=1.8.0,<2.0",
    "dhis2w-fhir-engine>=1.8.0,<2.0",
    "fastapi>=0.141.1",
    "joserfc>=1.7.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn>=0.49.0",
]

[project.urls]
Homepage = "https://github.com/winterop-com/dhis2w-utils"
Documentation = "https://winterop-com.github.io/dhis2w-utils/"
Repository = "https://github.com/winterop-com/dhis2w-utils"
Changelog = "https://github.com/winterop-com/dhis2w-utils/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
dhis2w-fhir = { workspace = true }
dhis2w-fhir-engine = { workspace = true }
