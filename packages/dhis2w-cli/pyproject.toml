[project]
name = "dhis2w-cli"
version = "1.0.0.dev1"
description = "d2w command-line interface (Typer) — mounts plugins from dhis2w-core."
readme = "README.md"
authors = [{ name = "Morten Hansen", email = "morten@winterop.com" }]
requires-python = ">=3.13"
dependencies = [
  "dhis2w-core>=1.0.0.dev1,<1.1",
  "typer>=0.26",
  "rich>=15",
]

[project.optional-dependencies]
browser = ["dhis2w-browser>=1.0.0.dev1,<1.1"]

[project.scripts]
d2w = "dhis2w_cli.main:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
