[project]
name = "dhis2w-browser"
version = "1.12.0"
description = "Playwright-based helpers for DHIS2 UI automation."
readme = "README.md"
authors = [{ name = "Morten Hansen", email = "morten@winterop.com" }]
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "dhis2w-client>=1.12.0,<2.0",
  "pillow>=12.3.0",
  "playwright>=1.61.0",
  "pydantic>=2.13",
]

[project.urls]
Homepage = "https://github.com/winterop-com/dhis2w-utils"
Documentation = "https://winterop-com.github.io/dhis2w-utils/"
Repository = "https://github.com/winterop-com/dhis2w-utils"
Changelog = "https://github.com/winterop-com/dhis2w-utils/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
