[project]
name = "dhis2w-mcp-bridge"
version = "1.14.0.dev0"
description = "Single-tool MCP bridge that exposes the d2w CLI for small local models."
readme = "README.md"
authors = [{ name = "Morten Hansen", email = "morten@winterop.com" }]
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "dhis2w-cli>=1.13.3,<2.0",
    "fastmcp>=3.4.7",
]

[project.scripts]
dhis2w-mcp-bridge = "dhis2w_mcp_bridge.server:main"

[project.urls]
Homepage = "https://github.com/winterop-com/dhis2w-utils"
Documentation = "https://winterop-com.github.io/dhis2w-utils/"
Repository = "https://github.com/winterop-com/dhis2w-utils"
Changelog = "https://github.com/winterop-com/dhis2w-utils/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
dhis2w-cli = { workspace = true }
