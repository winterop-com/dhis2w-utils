[project]
name = "dhis2w-client"
version = "1.10.0.dev0"
description = "Async DHIS2 API client with pluggable auth (Basic, PAT, OAuth2/OIDC) and pydantic models."
readme = "README.md"
authors = [{ name = "Morten Hansen", email = "morten@winterop.com" }]
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
keywords = ["dhis2", "client", "httpx", "pydantic", "oauth2"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "geojson-pydantic>=2.1.1",
  "httpx>=0.28.1",
  "pydantic>=2.13",
]

[project.urls]
Homepage = "https://github.com/winterop-com/dhis2w-utils"
Documentation = "https://winterop-com.github.io/dhis2w-utils/"
Repository = "https://github.com/winterop-com/dhis2w-utils"
Changelog = "https://github.com/winterop-com/dhis2w-utils/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
