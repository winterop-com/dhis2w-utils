[project]
name = "dhis2w-fhir"
version = "1.13.0"
description = "FHIR Implementation Guide generation from DHIS2 metadata — SUSHI project scaffolding, FSH emission, and FHIR-safety validation, mounted as the `d2w fhir` plugin."
readme = "README.md"
authors = [{ name = "Morten Hansen", email = "morten@winterop.com" }]
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "dhis2w-client",
    "dhis2w-core>=1.13.0,<2.0",
    "dhis2w-fhir-engine>=1.13.0,<2.0",
    "fastmcp>=3.4.7",
    "fpdf2>=2.8.7",
    "jinja2>=3.1.6",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "tomli-w>=1.2.0",
    "typer>=0.27.0",
]

[project.entry-points."dhis2.plugins"]
fhir = "dhis2w_fhir.plugin:plugin"

[project.urls]
Homepage = "https://github.com/winterop-com/dhis2w-utils"
Documentation = "https://winterop-com.github.io/dhis2w-utils/"
Repository = "https://github.com/winterop-com/dhis2w-utils"
Changelog = "https://github.com/winterop-com/dhis2w-utils/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
dhis2w-core = { workspace = true }
dhis2w-client = { workspace = true }
dhis2w-fhir-engine = { workspace = true }
